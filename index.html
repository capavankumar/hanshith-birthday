<script>
  /* Runs before first paint: arm the intro unless the guest prefers reduced motion. */
  (function () {

<style>
  :root {
    color-scheme: light;
    --paper: #FFF8E8;
    --ink: #1B2F6B;
    --ink-soft: #4B5784;
    --red: #D62828;
    --yellow: #F2B705;
    --blue: #2F6FD1;
    --green: #2BB673;
    --navy-btn: #1B2F6B;
    --surface: #FFFFFF;
    --line: #EADFC5;
    --check-dark: #1C1C1F;
    --check-light: #FFFDF6;
    --shadow: 0 18px 40px -18px rgba(27, 47, 107, 0.45);
    --focus: var(--yellow);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Baloo 2", "Trebuchet MS", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 600;
    line-height: 1.4;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top track: start lights, car pass, chequered strip ---------- */
  .track {
    position: relative;
    height: 74px;
    overflow: hidden;
    background: var(--paper);
  }
  .lights {
    position: absolute;
    left: 14px;
    top: 6px;
    width: 26px;
    height: 60px;
  }
  .lamp { opacity: 0.22; }
  .l-grn { opacity: 1; }
  .flagstrip {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 14px;
    background: conic-gradient(var(--check-dark) 25%, var(--check-light) 0 50%, var(--check-dark) 0 75%, var(--check-light) 0) 0 0 / 14px 14px;
    transform-origin: left center;
    transform: scaleX(1);
    will-change: transform;
  }
  .car {
    position: absolute;
    right: 14px;
    bottom: 12px;
    width: 84px;
    height: 38px;
    transform: translateX(0);
    will-change: transform;
  }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .car.lap   { animation: drive 1.2s cubic-bezier(0.3, 0, 0.2, 1) both; }
  .car.lap .wheel { animation: spin 1.2s linear both; }

  /* Vroom button: plays the engine rev (phones need a tap before sound can start) */
  .vroom {
    position: absolute;
    left: 50%;
    top: 9px;
    transform: translateX(-50%);
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 16px 0 12px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-weight: 800;
    font-size: 0.98rem;
    cursor: pointer;
    box-shadow: 0 6px 14px -8px rgba(27, 47, 107, 0.5);
    transition: transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .vroom:active { transform: translateX(-50%) scale(0.95); }
  .vroom:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .vroom svg { width: 20px; height: 20px; }
  .vroom.on { background: var(--yellow); border-color: var(--yellow); }
  .vroom .lbl-on { display: none; }
  .vroom.on .lbl-off { display: none; }
  .vroom.on .lbl-on { display: inline; }

  /* ---------- Bunting ---------- */
  .bunting {
    display: block;
    width: 100%;
    height: 34px;
  }

  /* ---------- Layout ---------- */
  main {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 6px 16px 40px;
    flex: 1;
  }

  .card {
    margin: 0;
    padding: 6px;
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow);
    transform: none;
    will-change: transform, opacity;
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 17px;
  }

  h1 {
    font-size: clamp(1.55rem, 7vw, 1.95rem);
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 24px 0 4px;
    text-align: center;
  }
  h1 .two { color: var(--red); }
  .when {
    margin: 0 0 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }
  .when .dot { color: var(--yellow); padding: 0 6px; }

  /* ---------- Countdown ---------- */
  .count {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 14px 12px 12px;
    margin: 0 0 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .count::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 6px;
    background: conic-gradient(var(--check-dark) 25%, var(--check-light) 0 50%, var(--check-dark) 0 75%, var(--check-light) 0) 0 0 / 6px 6px;
    opacity: 0.85;
  }
  .count-title {
    margin: 4px 0 10px;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .tiles[hidden] { display: none; }
  .tile {
    background: var(--paper);
    border-radius: 14px;
    padding: 8px 4px 6px;
  }
  .num {
    position: relative;
    height: 2.3rem;
    font-size: 2.1rem;
    font-weight: 800;
    line-height: 2.3rem;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  .num .v {
    position: absolute;
    inset: 0;
    display: block;
    text-align: center;
  }
  .num .v.in  { animation: roll-in 0.32s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
  .num .v.out { animation: roll-out 0.28s ease-in both; }
  .lbl {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .status-line {
    margin: 2px 0 0;
    font-size: 1.1rem;
    font-weight: 800;
  }
  .status-line[hidden] { display: none; }

  /* ---------- Buttons ---------- */
  .actions { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
    padding: 10px 16px;
    border-radius: 16px;
    color: #FFFFFF;
    text-decoration: none;
    box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.45);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-tap-highlight-color: transparent;
    will-change: transform;
  }
  .btn[hidden] { display: none; }
  .btn:active { transform: scale(0.97); box-shadow: 0 4px 10px -8px rgba(0, 0, 0, 0.5); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn .ic {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    display: grid;
    place-items: center;
  }
  .btn .ic svg { width: 22px; height: 22px; }
  .btn .tx { display: flex; flex-direction: column; line-height: 1.2; }
  .btn .tx b { font-size: 1.12rem; font-weight: 800; }
  .btn .tx small { font-size: 0.86rem; font-weight: 600; }
  .btn-map { background: var(--red); }
  .btn-google { background: var(--blue); }
  .btn-apple { background: var(--navy-btn); }

  .confirm {
    margin: 16px 0 0;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--surface);
    border: 2px dashed var(--yellow);
    text-align: center;
    font-size: 0.98rem;
  }
  .confirm[hidden] { display: none; }

  .sign {
    margin: 28px 0 0;
    padding-top: 18px;
    border-top: 2px dashed var(--line);
    text-align: center;
    color: var(--ink-soft);
  }
  .sign b { display: block; color: var(--ink); font-weight: 800; font-size: 1.05rem; }

  footer { padding-bottom: 8px; }
  footer .bunting { transform: scaleY(-1); }

  /* ---------- Confetti burst ---------- */
  .burst {
    position: absolute;
    left: 50%; top: 50%;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 2;
  }
  .burst i {
    position: absolute;
    left: -5px; top: -5px;
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--c);
    animation: pop 0.8s cubic-bezier(0.15, 0.7, 0.3, 1) both;
  }
  .burst i.chk {
    background: conic-gradient(#1C1C1F 25%, #fff 0 50%, #1C1C1F 0 75%, #fff 0) 0 0 / 5px 5px;
  }
  .burst i.rd { border-radius: 50%; }

  /* ---------- Keyframes ---------- */
  @keyframes lamp    { 0%, 50% { opacity: 1; } 72%, 100% { opacity: 0.22; } }
  @keyframes lamp-on { from { opacity: 0.22; } to { opacity: 1; } }
  @keyframes reveal  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes drive   { from { transform: translateX(-100vw); } to { transform: translateX(0); } }
  @keyframes spin    { from { transform: rotate(0deg); } to { transform: rotate(900deg); } }
  @keyframes rise    { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes roll-in  { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes roll-out { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
  @keyframes pop {
    0%   { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity: 0; }
  }

  /* ---------- Intro sequence (only while html.intro is set) ---------- */
  html.intro .l-red     { animation: lamp 0.65s linear 0s both; }
  html.intro .l-yel     { animation: lamp 0.65s linear 0.3s both; }
  html.intro .l-grn     { animation: lamp-on 0.25s ease-out 0.6s both; }
  html.intro .flagstrip { animation: reveal 0.55s ease-in-out 0.85s both; }
  html.intro .car       { animation: drive 0.55s ease-in-out 0.85s both; }
  html.intro .wheel     { animation: spin 0.55s linear 0.85s both; }
  html.intro .card      { animation: rise 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s both; }
  html.intro .fade      { animation: fade-up 0.4s ease-out both; }
  html.intro .d1 { animation-delay: 1.08s; }
  html.intro .d2 { animation-delay: 1.14s; }
  html.intro .d3 { animation-delay: 1.2s; }
  html.intro .d4 { animation-delay: 1.27s; }
  html.intro .d5 { animation-delay: 1.34s; }
  html.intro .d6 { animation-delay: 1.4s; }

  @media (prefers-reduced-motion: reduce) {
    html.intro .l-red, html.intro .l-yel, html.intro .l-grn, html.intro .flagstrip, html.intro .car,
    html.intro .wheel, html.intro .card, html.intro .fade, .num .v.in, .num .v.out, .burst i {
      animation: none !important;
    }
    .btn { transition: none; }
    .btn:active { transform: none; box-shadow: none; filter: brightness(0.9); }
  }

  @media (min-width: 720px) {
    .track { height: 84px; }
    .car { width: 96px; height: 44px; right: 24px; }
    .lights { left: 24px; top: 10px; }
    .vroom { top: 14px; }
    main { padding-top: 14px; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var doc = document, root = doc.documentElement;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- Intro: finish after the sequence, or on the first tap anywhere ---- */
  function finishIntro() {
    root.classList.remove("intro");
    doc.removeEventListener("pointerdown", finishIntro, true);
    doc.removeEventListener("keydown", finishIntro, true);
  }
  if (root.classList.contains("intro")) {
    doc.addEventListener("pointerdown", finishIntro, true);
    doc.addEventListener("keydown", finishIntro, true);
    setTimeout(finishIntro, 1800);
  }

  /* ---- Platform ordering: Apple first on iPhone and iPad ---- */
  var ua = navigator.userAgent || "";
  var isApple = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var actions = doc.getElementById("actions");
  var btnGoogle = doc.getElementById("btn-google");
  var btnApple = doc.getElementById("btn-apple");
  if (isApple) {
    actions.insertBefore(btnApple, btnGoogle);
    btnApple.classList.replace("d5", "d4");
    btnGoogle.classList.replace("d4", "d5");
  }

  /* ---- Countdown and event phases (fixed instants, independent of device zone) ---- */
  var START = Date.UTC(2026, 9, 24, 5, 30);        // 24 Oct 2026, 11:00 IST
  var THANKS_FROM = Date.UTC(2026, 9, 24, 18, 30); // 25 Oct 2026, 00:00 IST
  var tiles = doc.getElementById("tiles");
  var statusLine = doc.getElementById("status-line");
  var countTitle = doc.getElementById("count-title");
  var nums = { d: doc.getElementById("n-days"), h: doc.getElementById("n-hours"), m: doc.getElementById("n-mins") };
  var phase = "";

  function setNum(el, val) {
    var cur = el.querySelector(".v");
    if (cur && cur.textContent === val) return;
    var next = doc.createElement("span");
    next.className = cur && !reduce ? "v in" : "v";
    next.textContent = val;
    if (cur) {
      if (reduce) { cur.remove(); }
      else { cur.className = "v out"; setTimeout(function () { cur.remove(); }, 320); }
    }
    el.appendChild(next);
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function render() {
    var now = Date.now();
    if (now >= THANKS_FROM) {
      if (phase !== "thanks") {
        phase = "thanks";
        countTitle.textContent = "Thank you";
        tiles.hidden = true;
        statusLine.hidden = false;
        statusLine.textContent = "Thank you for celebrating with us. It meant a lot to our little racer.";
        btnGoogle.hidden = true;
        btnApple.hidden = true;
      }
      return;
    }
    if (now >= START) {
      if (phase !== "started") {
        phase = "started";
        countTitle.textContent = "Lights out";
        tiles.hidden = true;
        statusLine.hidden = false;
        statusLine.textContent = "The celebration has started. See you at Signature Dine!";
      }
      return;
    }
    phase = "countdown";
    var diff = START - now;
    var mins = Math.floor(diff / 60000);
    var days = Math.floor(mins / 1440);
    var hours = Math.floor((mins % 1440) / 60);
    var m = mins % 60;
    setNum(nums.d, String(days));
    setNum(nums.h, pad(hours));
    setNum(nums.m, pad(m));
    tiles.setAttribute("aria-label", days + " days, " + hours + " hours and " + m + " minutes to go");
  }
  render();
  setInterval(render, 15000);
  doc.addEventListener("visibilitychange", function () { if (!doc.hidden) render(); });

  /* ---- Tap feedback on calendar buttons: confetti burst and confirmation line ---- */
  var confirm = doc.getElementById("confirm");
  var colours = ["#D62828", "#F2B705", "#2F6FD1", "#2BB673"];
  function burst(btn) {
    if (reduce) return;
    var host = doc.createElement("span");
    host.className = "burst";
    host.setAttribute("aria-hidden", "true");
    for (var i = 0; i < 18; i++) {
      var p = doc.createElement("i");
      var angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.5;
      var dist = 70 + Math.random() * 60;
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist * 0.7 - 20 + "px");
      p.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
      p.style.setProperty("--c", colours[i % colours.length]);
      if (i % 4 === 0) p.className = "chk";
      else if (i % 4 === 2) p.className = "rd";
      p.style.animationDelay = (Math.random() * 60) + "ms";
      host.appendChild(p);
    }
    btn.appendChild(host);
    setTimeout(function () { host.remove(); }, 1000);
  }
  function onCalendarTap(e) {
    var btn = e.currentTarget;
    if (root.classList.contains("intro")) finishIntro();
    burst(btn);
    confirm.hidden = false;
    confirm.textContent = "Calendar opened. Save the event to get reminders.";
  }
  btnGoogle.addEventListener("click", onCalendarTap);
  btnApple.addEventListener("click", onCalendarTap);

  /* ---- Vroom: a synthesised engine rev (no audio file), about 7.5 s, plus a car lap ---- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var vroomBtn = doc.getElementById("vroom");
  var car = doc.getElementById("car");
  var actx = null, running = null;

  function carLap() {
    car.classList.remove("lap");
    void car.getBoundingClientRect();
    car.classList.add("lap");
    setTimeout(function () { car.classList.remove("lap"); }, 1300);
  }

  function stopVroom() {
    if (!running) return;
    var r = running; running = null;
    clearTimeout(r.lapTimer); clearTimeout(r.endTimer);
    try {
      var t = actx.currentTime;
      r.master.gain.cancelScheduledValues(t);
      r.master.gain.setValueAtTime(r.master.gain.value, t);
      r.master.gain.linearRampToValueAtTime(0.0001, t + 0.15);
      r.nodes.forEach(function (n) { n.stop(t + 0.2); });
    } catch (err) {}
    vroomBtn.classList.remove("on");
    vroomBtn.setAttribute("aria-label", "Play engine sound");
  }

  function playVroom() {
    if (!AC) return false;
    if (!actx) actx = new AC();
    if (actx.state === "suspended") actx.resume();
    if (actx.state !== "running") return false;
    stopVroom();

    var t = actx.currentTime, dur = 7.5, sr = actx.sampleRate;
    var master = actx.createGain(); master.gain.setValueAtTime(0.0001, t); master.connect(actx.destination);

    var lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 3; lp.connect(master);
    var saw = actx.createOscillator(); saw.type = "sawtooth"; saw.connect(lp);
    var sq = actx.createOscillator(); sq.type = "square";
    var sqG = actx.createGain(); sqG.gain.value = 0.3; sq.connect(sqG); sqG.connect(lp);
    var wob = actx.createOscillator(); wob.frequency.value = 16;
    var wobG = actx.createGain(); wobG.gain.value = 5; wob.connect(wobG); wobG.connect(saw.frequency);

    var buf = actx.createBuffer(1, sr * 2, sr), d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    var noise = actx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    var bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
    var nG = actx.createGain(); nG.gain.value = 0.1;
    noise.connect(bp); bp.connect(nG); nG.connect(master);

    /* [seconds, engine hz]: idle, three gears, then drive away */
    var pts = [[0, 46], [0.5, 50], [0.7, 58], [2.0, 215], [2.1, 125], [3.6, 265], [3.7, 160], [5.4, 310], [6.0, 290], [7.5, 80]];
    pts.forEach(function (p, i) {
      var at = t + p[0], hz = p[1];
      if (i === 0) {
        saw.frequency.setValueAtTime(hz, at); sq.frequency.setValueAtTime(hz / 2, at);
        lp.frequency.setValueAtTime(Math.max(400, hz * 9), at); bp.frequency.setValueAtTime(hz * 14, at);
        return;
      }
      var sharp = (p[0] - pts[i - 1][0]) < 0.2;
      var m = sharp ? "linearRampToValueAtTime" : "exponentialRampToValueAtTime";
      saw.frequency[m](hz, at); sq.frequency[m](hz / 2, at);
      lp.frequency[m](Math.min(5000, Math.max(400, hz * 9)), at); bp.frequency[m](Math.min(7000, hz * 14), at);
      if (sharp) { /* gear change: brief dip */
        master.gain.setValueAtTime(0.5, at - 0.1); master.gain.linearRampToValueAtTime(0.18, at); master.gain.linearRampToValueAtTime(0.5, at + 0.12);
      }
    });
    master.gain.linearRampToValueAtTime(0.5, t + 0.35);
    master.gain.setValueAtTime(0.5, t + 6.0);
    master.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    var nodes = [saw, sq, wob, noise];
    nodes.forEach(function (n) { n.start(t); n.stop(t + dur + 0.05); });

    running = { master: master, nodes: nodes };
    running.lapTimer = setTimeout(carLap, 1900);
    running.endTimer = setTimeout(function () { if (running) { running = null; vroomBtn.classList.remove("on"); vroomBtn.setAttribute("aria-label", "Play engine sound"); } }, dur * 1000);
    vroomBtn.classList.add("on");
    vroomBtn.setAttribute("aria-label", "Stop engine sound");
    return true;
  }

  vroomBtn.addEventListener("click", function () {
    if (running) { stopVroom(); return; }
    if (!playVroom() && actx) {
      /* First tap only unlocked audio on some phones: try once more right after. */
      actx.resume().then(function () { playVroom(); }, function () {});
    }
  });

  /* Try to autoplay; most phones refuse until the guest taps, and the button covers that. */
  if (AC) {
    try {
      actx = new AC();
      var attempt = function () {
        actx.resume().then(function () { if (actx.state === "running" && !running) playVroom(); }, function () {});
      };
      if (actx.state === "running") setTimeout(function () { if (!running) playVroom(); }, 700);
      else setTimeout(attempt, 700);
    } catch (err) {}
  } else {
    vroomBtn.hidden = true;
  }
})();
</script>
</body>
</html>
